name: Installer CI

on:
  push:
    branches: [main]
    paths:
      - '*.sh'
      - 'install/**'
      - 'scripts/test-go-installer.sh'
      - 'scripts/test-setup-command.sh'
      - 'scripts/test-docker-data-path.sh'
      - 'scripts/build-test-image.sh'
      - 'neodesk-server/cli_cmd.go'
      - 'neodesk-server/cli_setup*.go'
      - 'neodesk-server/cli_client*.go'
      - 'neodesk-server/testdata/client-options.txt'
      - 'scripts/client-options.sh'
      - 'release-notes/**'
      - '.github/workflows/release-go.yml'
      - 'scripts/test-docker-installer.sh'
      - 'scripts/check-supervisor-env.sh'
      - 'scripts/test-windows-installer.ps1'
      - 'scripts/test-windows-service.ps1'
      - 'neodesk-server/main.go'
      - 'neodesk-server/winservice*.go'
      - 'neodesk-server/logging/**'
      - 'scripts/check-go-toolchain-pins.sh'
      - 'neodesk-server/go.mod'
      - 'scripts/test-postgresql-hba.sh'
      - 'scripts/test-docker-hardening.sh'
      - 'scripts/docker-latest.sh'
      - 'scripts/test-docker-latest.sh'
      - 'neodesk-server/cli/**'
      - 'neodesk-server/console/safepath/**'
      - 'neodesk-server/console/updater/**'
      - '.dockerignore'
      - 'docker/**'
      - '.github/workflows/installer-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - '*.sh'
      - 'install/**'
      - 'scripts/test-go-installer.sh'
      - 'scripts/test-setup-command.sh'
      - 'scripts/test-docker-data-path.sh'
      - 'scripts/build-test-image.sh'
      - 'neodesk-server/cli_cmd.go'
      - 'neodesk-server/cli_setup*.go'
      - 'neodesk-server/cli_client*.go'
      - 'neodesk-server/testdata/client-options.txt'
      - 'scripts/client-options.sh'
      - 'release-notes/**'
      - '.github/workflows/release-go.yml'
      - 'scripts/test-docker-installer.sh'
      - 'scripts/check-supervisor-env.sh'
      - 'scripts/test-windows-installer.ps1'
      - 'scripts/test-windows-service.ps1'
      - 'neodesk-server/main.go'
      - 'neodesk-server/winservice*.go'
      - 'neodesk-server/logging/**'
      - 'scripts/check-go-toolchain-pins.sh'
      - 'neodesk-server/go.mod'
      - 'scripts/test-postgresql-hba.sh'
      - 'scripts/test-docker-hardening.sh'
      - 'scripts/docker-latest.sh'
      - 'scripts/test-docker-latest.sh'
      - 'neodesk-server/cli/**'
      - 'neodesk-server/console/safepath/**'
      - 'neodesk-server/console/updater/**'
      - '.dockerignore'
      - 'docker/**'
      - '.github/workflows/installer-ci.yml'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Published GHCR tag to smoke-test with the files of its own release; empty tests the image of this checkout'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: installer-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bash-static:
    name: Bash installer syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check that the top-level scripts are executable in git
        run: |
          set -euo pipefail
          bad="$(git ls-files -s -- ':(glob)*.sh' | awk '$1 != "100755" { print $4 }')"
          if [ -n "$bad" ]; then
            echo "These scripts are not executable in git, so ./script.sh fails in a fresh clone:"
            printf '%s\n' "$bad" | sed 's/^/  /'
            echo "Fix: git update-index --chmod=+x <script>"
            exit 1
          fi
      - name: Parse all Bash installers
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            bash -n "$file"
          done < <(printf '%s\n' \
            install/install.sh \
            install/neodesk.sh \
            install/neodesk-docker.sh \
            scripts/test-native-installer.sh \
            scripts/test-go-installer.sh \
            scripts/test-setup-command.sh \
            scripts/test-docker-data-path.sh \
            scripts/build-test-image.sh \
            scripts/test-docker-installer.sh \
            scripts/check-supervisor-env.sh \
            scripts/check-go-toolchain-pins.sh \
            scripts/test-postgresql-hba.sh \
            scripts/test-docker-hardening.sh \
            scripts/docker-latest.sh \
            scripts/test-docker-latest.sh)
      - name: Run ShellCheck
        run: |
          shellcheck --severity=error \
            install/install.sh \
            install/neodesk.sh \
            install/neodesk-docker.sh \
            scripts/test-native-installer.sh \
            scripts/test-go-installer.sh \
            scripts/test-setup-command.sh \
            scripts/test-docker-data-path.sh \
            scripts/build-test-image.sh \
            scripts/test-docker-installer.sh \
            scripts/check-supervisor-env.sh \
            scripts/check-go-toolchain-pins.sh \
            scripts/test-postgresql-hba.sh \
            scripts/test-docker-hardening.sh \
            scripts/docker-latest.sh \
            scripts/test-docker-latest.sh
      - name: Test the native installer's functions (update, the way back, the commands)
        run: bash scripts/test-go-installer.sh
      - name: Check the Go pins of the installers against go.mod
        run: bash scripts/check-go-toolchain-pins.sh
      - name: Test the Docker manager's update and backup
        run: bash scripts/test-docker-installer.sh
      - name: Test which release moves the Docker images' latest tag
        run: bash scripts/test-docker-latest.sh
      - name: Check that the systemd unit and the image name their supervisor
        run: bash scripts/check-supervisor-env.sh
      - name: Test the Windows installer's service and task set-up
        shell: pwsh
        run: ./scripts/test-windows-installer.ps1
      - name: Test native installer watchdog and clone recovery
        run: bash scripts/test-native-installer.sh
      - name: Test PostgreSQL pg_hba.conf setup
        run: bash scripts/test-postgresql-hba.sh

  powershell-static:
    name: PowerShell installer syntax
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Parse PowerShell installers
        shell: pwsh
        run: |
          $files = @(
            "install/neodesk.ps1",
            "scripts/test-windows-installer.ps1",
            "scripts/test-windows-service.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $messages = $errors | ForEach-Object { $_.Message }
              throw "$file failed to parse: $($messages -join '; ')"
            }
          }

  windows-service:
    name: Windows service on a real install
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: neodesk-server/go.mod
          cache-dependency-path: neodesk-server/go.sum
      - name: Build the server
        working-directory: neodesk-server
        shell: pwsh
        run: |
          $env:CGO_ENABLED = "0"
          go build -trimpath -o "$env:RUNNER_TEMP\neodesk-server.exe" .
      # neodesk.ps1 -Auto installs it as the service NeoDeskServer; then a
      # stop, a crash, the update of an install made as a SYSTEM task and
      # the uninstall, in Windows PowerShell 5.1 as on a server
      - name: Install, stop, restart, update and uninstall the service
        shell: powershell
        run: .\scripts\test-windows-service.ps1 -Binary "$env:RUNNER_TEMP\neodesk-server.exe"
      - name: The server's log
        if: always()
        shell: pwsh
        run: Get-Content C:\NeoDesk\logs\server.log -Tail 200 -ErrorAction SilentlyContinue

  installer-unit:
    name: Installer reliability unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: neodesk-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: neodesk-server/go.mod
          cache-dependency-path: neodesk-server/go.sum
      # The subcommands the installers call (check, env merge, config,
      # reset-password), the path checks and the updater
      - name: Run installer-focused tests
        run: go test -count=1 ./cli/... ./console/safepath/... ./console/updater/...
      # neodesk hands neodesk.sh's options to neodesk-setup and the desktop
      # client's to /usr/bin/neodesk: the lists in Go against the
      # installer's argument loop and the client's (testdata), and the
      # hand-overs themselves
      - name: Test the hand-over of the installer's and the client's options
        run: go test -count=1 -run 'Setup|InstallersFlags|OtherCallsStay|BareSudo|Client' .

  setup-command:
    name: Installer commands on a real install
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: neodesk-server/go.mod
          cache-dependency-path: neodesk-server/go.sum
      - name: Build the server
        working-directory: neodesk-server
        run: CGO_ENABLED=0 go build -o "$RUNNER_TEMP/neodesk-server" .
      # A fresh install, the installer's options through neodesk, an update
      # by neodesk-setup and one by the old manager of 3.6.0-rc.4, and the
      # uninstall
      - name: Install, update and uninstall on this runner
        run: sudo NEODESK_TEST_BINARY="$RUNNER_TEMP/neodesk-server" bash scripts/test-setup-command.sh

  docker-data-path:
    name: Docker data folder on a real install
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: neodesk-server/go.mod
          cache-dependency-path: neodesk-server/go.sum
      - name: Build the server
        working-directory: neodesk-server
        run: CGO_ENABLED=0 go build -o "$RUNNER_TEMP/neodesk-server" .
      # An install of 3.6.0-rc.4 with data, updated to the image of this
      # checkout (data volume at /opt/neodesk/data), and its backup from
      # before the update put back
      - name: Update an install of 3.6.0-rc.4 and restore its backup
        run: NEODESK_TEST_BINARY="$RUNNER_TEMP/neodesk-server" bash scripts/test-docker-data-path.sh

  # install.sh --node on this runner, next to a stand-in server install:
  # the unit, env file and state folder of the relay node, the update and
  # the uninstall, with a stand-in binary until the server has node mode
  relay-node-install:
    name: Relay node install on this runner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install, update and remove a relay node
        shell: sudo bash {0}
        run: |
          set -euo pipefail
          fail() { echo "FAIL: $*"; exit 1; }
          # A stand-in for neodesk-server until node mode lands: it answers
          # -version, carries the strings the installer looks for (upgrade-env
          # --from FILE, NODE_JOIN) and, as "node", enrolls once with NODE_JOIN
          fake="$(mktemp -d)/neodesk-server"
          cat > "$fake" <<'EOF'
          #!/bin/sh
          # upgrade-env --from FILE
          case "$1" in
              -version) echo "neodesk-server 0.0.0-test"; exit 0 ;;
              node)
                  [ "$MODE" = node ] && [ -n "$NODE_DATA_DIR" ] || exit 2
                  if [ -n "${NODE_JOIN:-}" ] && [ ! -s "$NODE_DATA_DIR/node.json" ]; then
                      printf '{"node_id":"test"}\n' > "$NODE_DATA_DIR/node.json"
                  fi
                  [ -s "$NODE_DATA_DIR/node.json" ] || exit 2
                  exec sleep infinity
                  ;;
          esac
          exit 1
          EOF
          chmod 0755 "$fake"
          export SERVER_BINARY_FILE="$fake"
          env_file=/etc/neodesk-relay-node/node.env
          state=/var/lib/neodesk-relay-node
          unit=/etc/systemd/system/neodesk-relay-node.service

          help=$(bash install/install.sh --help)
          grep -q -- '--node' <<< "$help" || fail "install.sh --help names no --node"
          help=$(bash install/neodesk.sh --help)
          grep -q -- '--public-addr' <<< "$help" || fail "neodesk.sh --help names no --public-addr"

          # A server install on the same machine stays as it is
          mkdir -p /opt/neodesk && echo keep > /opt/neodesk/marker
          printf '[Service]\nExecStart=/bin/true\n' > /etc/systemd/system/neodesk-server.service
          before=$(sha256sum /etc/systemd/system/neodesk-server.service /opt/neodesk/marker)

          if bash install/install.sh --node --lan-addr 10.0.0.5; then fail "a first install without --join went through"; fi
          if bash install/install.sh --node --join 'nd1.x;rm -rf /'; then fail "a join string with ; went through"; fi
          if bash install/install.sh --node --join nd1.eyJ0IjoxfQ --lan-addr 2001:db8::5; then fail "an IPv6 address without brackets went through"; fi

          bash install/install.sh --node --join nd1.eyJ0IjoxfQ --lan-addr 10.0.0.5 --public-addr 203.0.113.7:443
          systemctl is-active --quiet neodesk-relay-node || fail "the node does not run"
          [ "$(stat -c '%a %U' "$env_file")" = "600 root" ] || fail "env file: $(stat -c '%a %U' "$env_file")"
          grep -qx 'MODE=node' "$env_file" || fail "no MODE=node"
          grep -qx "NODE_DATA_DIR=$state" "$env_file" || fail "no NODE_DATA_DIR"
          grep -qx 'NODE_LAN_ADDR=10.0.0.5:21117' "$env_file" || fail "LAN address: $(grep NODE_LAN_ADDR "$env_file")"
          grep -qx 'NODE_PUBLIC_ADDR=203.0.113.7:443' "$env_file" || fail "public address"
          if grep -q '^NODE_JOIN=' "$env_file"; then fail "the join string stayed after the enrollment"; fi
          [ "$(stat -c '%a %U' "$state")" = "700 neodesk-relay-node" ] || fail "state folder: $(stat -c '%a %U' "$state")"
          [ -s "$state/node.json" ] || fail "no node.json"
          [ "$(ps -o user= -p "$(systemctl show -p MainPID --value neodesk-relay-node)")" = neodesk-relay-node ] || fail "the node does not run as neodesk-relay-node"
          [ "$(stat -c '%a %U' /opt/neodesk-relay-node/neodesk-server)" = "755 root" ] || fail "binary owner"
          if command -v systemd-analyze >/dev/null; then
              out=$(systemd-analyze verify "$unit" 2>&1) || fail "systemd-analyze verify: $out"
              if [ -n "$out" ]; then echo "systemd-analyze verify says: $out"; fi
          fi

          # Again without --join: an update that keeps the settings
          bash install/install.sh --node
          systemctl is-active --quiet neodesk-relay-node || fail "the node does not run after the update"
          grep -qx 'NODE_PUBLIC_ADDR=203.0.113.7:443' "$env_file" || fail "the update lost the public address"
          if bash install/install.sh --node --join nd1.eyJ0IjoyfQ; then fail "a second --join on an enrolled node went through"; fi

          [ "$before" = "$(sha256sum /etc/systemd/system/neodesk-server.service /opt/neodesk/marker)" ] || fail "the server install was touched"

          bash install/install.sh --node --uninstall
          [ ! -e "$unit" ] && [ ! -e /opt/neodesk-relay-node ] && [ ! -e "$env_file" ] || fail "the uninstall left the unit, binary or env file"
          [ -s "$state/node.json" ] || fail "the uninstall without --purge removed the key"
          bash install/install.sh --node --uninstall --purge
          [ ! -e "$state" ] || fail "--purge left $state"
          if id neodesk-relay-node >/dev/null 2>&1; then fail "--purge left the account"; fi
          [ "$before" = "$(sha256sum /etc/systemd/system/neodesk-server.service /opt/neodesk/marker)" ] || fail "the server install was touched"
          echo "relay node install: all checks passed"

  installer-dry-run:
    name: Installer non-mutating CLI checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify help paths do not mutate the host
        run: |
          set -euo pipefail
          bash install/install.sh --help >/dev/null
          bash install/neodesk.sh --help >/dev/null
          bash install/neodesk-docker.sh --help >/dev/null

  compose-static:
    name: Docker Compose validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PG_PASSWORD: installer-ci-placeholder
      MACVLAN_IPV4: 192.0.2.51
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate compose manifests
        run: |
          set -euo pipefail
          for file in \
            install/docker-compose.single.yml \
            install/docker-compose.quick.single.yml \
            install/docker-compose.quick.single.macvlan.yml \
            install/docker-compose.relay-node.yml; do
            docker compose -f "$file" config --quiet
          done
      # The relay node runs in node mode, publishes the relay's TCP and
      # WebSocket ports and the leg port and keeps its key in the volume
      - name: Check the relay node's compose file
        run: |
          set -euo pipefail
          config=$(NODE_JOIN=nd1.test docker compose -f install/docker-compose.relay-node.yml config --format json)
          jq -e '.services["relay-node"] | .environment.MODE == "node" and .environment.NODE_JOIN == "nd1.test"
            and .environment.NODE_DATA_DIR == "/opt/neodesk/data"
            and ([.ports[].target] | sort) == [21117, 21119, 21125]
            and ([.volumes[] | select(.target == "/opt/neodesk/data") | .type] == ["volume"])' <<< "$config" >/dev/null \
            || { echo "install/docker-compose.relay-node.yml:"; jq '.services["relay-node"]' <<< "$config"; exit 1; }
      # The console is published on every address (IPv6 too) unless
      # NEODESK_CONSOLE_BIND names one
      - name: Check the console's published addresses
        run: |
          set -euo pipefail
          for file in install/docker-compose.single.yml install/docker-compose.quick.single.yml; do
            hosts=$(docker compose -f "$file" config --format json | jq -r '[.services.neodesk.ports[] | select(.target == 3375 or .target == 5443) | .host_ip // "all"] | join(" ")')
            [ "$hosts" = "all all" ] || { echo "$file publishes the console on: $hosts"; exit 1; }
            hosts=$(NEODESK_CONSOLE_BIND=127.0.0.1 docker compose -f "$file" config --format json | jq -r '[.services.neodesk.ports[] | select(.target == 3375 or .target == 5443) | .host_ip // "all"] | join(" ")')
            [ "$hosts" = "127.0.0.1 127.0.0.1" ] || { echo "$file with NEODESK_CONSOLE_BIND publishes the console on: $hosts"; exit 1; }
          done

  # The smoke tests run the compose files with the image they belong to:
  # the image of this checkout, or with image_tag a published image and the
  # files of the release it was built from (a compose file of this checkout
  # can name paths an older image does not have)
  docker-hardening-smoke:
    name: Docker hardened bind-mount smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEODESK_IMAGE_TAG: ${{ inputs.image_tag || 'local' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        if: ${{ !inputs.image_tag }}
        with:
          go-version-file: neodesk-server/go.mod
          cache-dependency-path: neodesk-server/go.sum
      - name: Build the image of this checkout
        if: ${{ !inputs.image_tag }}
        run: |
          set -euo pipefail
          (cd neodesk-server && CGO_ENABLED=0 go build -o "$RUNNER_TEMP/neodesk-server" .)
          NEODESK_TEST_BINARY="$RUNNER_TEMP/neodesk-server" bash scripts/build-test-image.sh "$NEODESK_IMAGE_TAG"
      - name: Check out the release of the published image
        if: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          image="ghcr.io/neodeskapp/neodesk:$NEODESK_IMAGE_TAG"
          docker pull -q "$image"
          revision=$(docker image inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")
          [ -n "$revision" ] || { echo "$image names no revision"; exit 1; }
          git fetch --depth=1 origin "$revision"
          git checkout --detach FETCH_HEAD
      - name: Verify hardened bind mounts and restart behavior
        run: bash scripts/test-docker-hardening.sh

  docker-runtime-smoke:
    name: Docker runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEODESK_IMAGE_TAG: ${{ inputs.image_tag || 'local' }}
      ADMIN_PASSWORD: InstallerSmoke-ChangeMe-9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        if: ${{ !inputs.image_tag }}
        with:
          go-version-file: neodesk-server/go.mod
          cache-dependency-path: neodesk-server/go.sum
      - name: Build the image of this checkout
        if: ${{ !inputs.image_tag }}
        run: |
          set -euo pipefail
          (cd neodesk-server && CGO_ENABLED=0 go build -o "$RUNNER_TEMP/neodesk-server" .)
          NEODESK_TEST_BINARY="$RUNNER_TEMP/neodesk-server" bash scripts/build-test-image.sh "$NEODESK_IMAGE_TAG"
      - name: Check out the release of the published image
        if: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          image="ghcr.io/neodeskapp/neodesk:$NEODESK_IMAGE_TAG"
          docker pull -q "$image"
          revision=$(docker image inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")
          [ -n "$revision" ] || { echo "$image names no revision"; exit 1; }
          git fetch --depth=1 origin "$revision"
          git checkout --detach FETCH_HEAD
      - name: The compose file of the image's commit
        run: |
          # In install/ since 3.6.0-rc.5, at the root before
          compose=install/docker-compose.quick.single.yml
          [ -f "$compose" ] || compose=docker-compose.quick.single.yml
          echo "COMPOSE_FILE=$compose" >> "$GITHUB_ENV"
          # The console's port: 3375 since 3.6.0-rc.5, 5000 before
          port=3375
          grep -q 'NEODESK_CONSOLE_PORT:-3375' "$compose" || port=5000
          echo "CONSOLE_PORT_OF_IMAGE=$port" >> "$GITHUB_ENV"
      - name: Start official single-container stack
        run: |
          set -euo pipefail
          docker compose -f "$COMPOSE_FILE" up -d --wait --pull never
      - name: Verify API and console health
        run: |
          set -euo pipefail
          curl --fail --retry 30 --retry-delay 2 --retry-connrefused \
            http://127.0.0.1:21121/api/health
          curl --fail --retry 30 --retry-delay 2 --retry-connrefused \
            "http://127.0.0.1:${CONSOLE_PORT_OF_IMAGE}/health"
          docker compose -f "$COMPOSE_FILE" exec -T -u neodesk neodesk \
            /usr/local/bin/neodesk-server check \
            --api http://127.0.0.1:21121/api/health \
            --panel "http://127.0.0.1:${CONSOLE_PORT_OF_IMAGE}/health" \
            --port 127.0.0.1:21121
          docker compose -f "$COMPOSE_FILE" ps
      - name: Tear down smoke stack
        if: always()
        run: docker compose -f "$COMPOSE_FILE" down -v
